<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071622"><title>TMR SURF AI</title><style>body{margin:0;background:#071825;color:#e8f5ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:720px;margin:auto;padding:18px}header,.flex{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:24px}button{background:#17435a;color:white;border:1px solid #39637b;border-radius:10px;padding:12px;cursor:pointer}.card{background:#102e40;border:1px solid #305269;border-radius:16px;padding:16px;margin:14px 0}.score{font-size:54px;font-weight:800}.muted,small{color:#9dbaca}.tabs{display:flex;gap:9px}.tabs button{flex:1}.active{background:#0679aa}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px 2px;border-bottom:1px solid #345166;text-align:right}td:first-child,th:first-child{text-align:left}.spot{width:100%;display:flex;justify-content:space-between;margin:4px 0}.pill{border-radius:15px;background:#20495d;padding:6px 12px;font-size:13px}p{line-height:1.6}</style></head><body><main><header><div><small>SURF INTELLIGENCE</small><h1>🌊 TMR SURF AI</h1></div><button id="refresh">↻ 更新</button></header><div class="tabs"><button id="morning">20:00 翌朝</button><button id="evening">10:00 夕方</button></div><section class="card"><small id="periodLabel">予報取得中</small><div class="flex"><div><div class="score" id="score">—</div><strong id="judgement">取得待ち</strong></div><span class="pill" id="point">サンライズ</span></div><p id="summary"></p></section><section class="card"><h3>ポイントランキング</h3><div id="ranking">取得中…</div></section><section class="card"><h3>時間別コンディション</h3><div id="conditions"></div><table><thead><tr><th>時刻</th><th>波高</th><th>周期</th><th>風速</th><th>点数</th></tr></thead><tbody id="hourly"></tbody></table></section><small id="status"></small><p><small>海上予報波高は実際の波のフェイスサイズとは異なります。採点は暫定モデル。潮位・地形・ブレイク形状・現地の危険要素は未反映のため80点以上の確定GO判定は出しません。必ず現況と安全を確認してください。データ：Open-Meteo。</small></p></main><script>
const spots=[{id:'sunrise',name:'サンライズ',lat:35.365,lon:140.392,coast:105},{id:'umaya',name:'馬小屋前',lat:35.377,lon:140.396,coast:105},{id:'katakai',name:'片貝',lat:35.525,lon:140.458,coast:105},{id:'taito',name:'太東',lat:35.327,lon:140.386,coast:110},{id:'onjuku',name:'御宿',lat:35.185,lon:140.361,coast:135},{id:'iioka',name:'飯岡',lat:35.699,lon:140.727,coast:145},{id:'heisakura',name:'平砂浦',lat:34.947,lon:139.789,coast:180},{id:'shonan',name:'湘南・鵠沼',lat:35.322,lon:139.470,coast:180},{id:'oarai',name:'茨城・大洗',lat:36.316,lon:140.589,coast:105}];
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));let all={},mode='',picked='sunrise',fetched=0,source='';const nowJ=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');function getMode(){let h=nowJ().getHours();return h>=20||h<10?'morning':'evening'}function session(){let d=nowJ();if(mode==='morning'&&d.getHours()>=20)d.setDate(d.getDate()+1);return {day:iso(d),start:mode==='morning'?4:15,end:mode==='morning'?7:18}}function diff(a,b){return Math.abs(((a-b+540)%360)-180)}function score(r,s){if([r.h,r.p,r.w,r.wd].some(v=>typeof v!=='number'||!isFinite(v)))return null;let angle=diff(r.wd,(s.coast+180)%360),f=angle<55?1:angle<105?.6:.17;let base=clamp((r.h-.4)*26,0,25)+clamp(13+5*(r.p-7)/4+5*f-4*Math.max(0,r.h-2),0,25)+clamp(20-r.w*(f>.6?1.2:2.7),0,20)+clamp((r.p-5)*2.1,0,15)+5+2;let bonus=r.h<.65?0:r.h<.95?1:r.h<1.3?3:r.h<1.7?5:r.h<2.2?7:8;let danger=r.w>=11||r.h>=3.4;let value=Math.round(clamp(base+bonus,0,danger?59:79));return {value,bonus,judge:danger?'NO GO':value>=70?'要現況確認':value>=60?'WAIT':'NO GO'} }
async function direct(s){const common='latitude='+s.lat+'&longitude='+s.lon+'&timezone=Asia%2FTokyo&forecast_days=7',a='https://marine-api.open-meteo.com/v1/marine?'+common+'&cell_selection=sea&hourly=wave_height,wave_direction,wave_period',b='https://api.open-meteo.com/v1/forecast?'+common+'&wind_speed_unit=ms&hourly=wind_speed_10m,wind_direction_10m';let [m,w]=await Promise.all([fetch(a),fetch(b)]);if(!m.ok||!w.ok)throw Error('API error');m=(await m.json()).hourly;w=(await w.json()).hourly;let index=new Map(w.time.map((t,i)=>[t,i]));return m.time.map((t,i)=>{let j=index.get(t);return j===undefined?null:{t,h:m.wave_height[i],p:m.wave_period[i],wd:w.wind_direction_10m[j],w:w.wind_speed_10m[j]}}).filter(Boolean)}
async function load(){ $('status').textContent='予報を取得しています…';$('refresh').disabled=true;let snap;try{let r=await fetch('./data/latest.json?ts='+Date.now(),{cache:'no-store'});if(r.ok)snap=await r.json()}catch(e){}if(snap?.fetchedAt&&Date.now()-snap.fetchedAt<13*3600000&&spots.every(s=>snap.all?.[s.id]?.length)){all=snap.all;fetched=snap.fetchedAt;source='定時スナップショット'}else{let settled=await Promise.allSettled(spots.map(async s=>[s.id,await direct(s)]));all={};settled.forEach(x=>{if(x.status==='fulfilled')all[x.value[0]]=x.value[1]});fetched=Date.now();source='ブラウザ直接取得'}$('refresh').disabled=false;render()}
function render(){let q=session();$('morning').className=mode==='morning'?'active':'';$('evening').className=mode==='evening'?'active':'';$('periodLabel').textContent=q.day+' '+(mode==='morning'?'翌朝4〜7時':'当日15〜18時');let ranking=spots.map(s=>{let rows=(all[s.id]||[]).filter(r=>r.t.startsWith(q.day)&&+r.t.slice(11,13)>=q.start&&+r.t.slice(11,13)<=q.end).map(r=>({r,a:score(r,s)})).filter(x=>x.a).sort((x,y)=>y.a.value-x.a.value);return {s,top:rows[0]}}).filter(x=>x.top).sort((x,y)=>y.top.a.value-x.top.a.value);$('ranking').innerHTML=ranking.map((x,i)=>'<button class="spot" data-id="'+x.s.id+'"><span>'+(i+1)+'. '+x.s.name+'</span><span>'+x.top.a.value+'点 '+x.top.a.judge+'</span></button>').join('')||'データなし';document.querySelectorAll('.spot').forEach(b=>b.onclick=()=>{picked=b.dataset.id;render()});let item=ranking.find(x=>x.s.id===picked)||ranking[0];if(!item){$('score').textContent='—';$('judgement').textContent='取得エラー';$('status').textContent='予報データなし。再取得してください';return}let r=item.top.r,a=item.top.a;$('point').textContent=item.s.name;$('score').textContent=a.value+'/100';$('judgement').textContent=a.judge;$('summary').textContent='最良時刻 '+r.t.slice(11,16)+' / 波高 '+r.h.toFixed(2)+'m / 周期 '+r.p+'秒 / 風速 '+r.w.toFixed(1)+'m/s / サイズ加点 +'+a.bonus+'点。現況確認前の暫定点。';$('conditions').textContent='時間帯 '+q.start+':00〜'+q.end+':00';$('hourly').innerHTML=(all[item.s.id]||[]).filter(x=>x.t.startsWith(q.day)&&+x.t.slice(11,13)>=q.start&&+x.t.slice(11,13)<=q.end).map(x=>{let a=score(x,item.s);return '<tr><td>'+x.t.slice(11,16)+'</td><td>'+x.h.toFixed(2)+'m</td><td>'+x.p+'s</td><td>'+x.w.toFixed(1)+'m/s</td><td>'+(a?a.value:'—')+'</td></tr>'}).join('');$('status').textContent='取得方法: '+source+' / 取得日時: '+new Date(fetched).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})+' / 定時取得が遅延した場合は直接取得します。'}
$('morning').onclick=()=>{mode='morning';render()};$('evening').onclick=()=>{mode='evening';render()};$('refresh').onclick=load;mode=getMode();load();setInterval(()=>{let next=getMode();if(next!==mode){mode=next;load()}},60000);
</script></body></html>
